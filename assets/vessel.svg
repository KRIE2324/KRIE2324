      <g transform="translate(0 265)" opacity=".16"><use href="#wave"><animateTransform attributeName="transform" type="translate" from="0 0" to="-240 0" dur="11s" repeatCount="indefinite"/></use></g>
      <g transform="translate(0 305)" opacity=".12"><use href="#wave"><animateTransform attributeName="transform" type="translate" from="0 0" to="-240 0" dur="8s" repeatCount="indefinite"/></use></g>
