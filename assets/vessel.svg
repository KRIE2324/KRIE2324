<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">kyrie | Control Engineering and Underwater Robotics</title>
  <desc id="desc">An animated research vessel sails across a moonlit ocean, gently pitching on moving waves with a flowing wake.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#071320"/><stop offset="1" stop-color="#173a50"/></linearGradient>
    <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#15475c"/><stop offset="1" stop-color="#061923"/></linearGradient>
    <linearGradient id="hull" x2="0" y2="1"><stop stop-color="#e0edf0"/><stop offset="1" stop-color="#829eaf"/></linearGradient>
    <linearGradient id="bridge" x2="0" y2="1"><stop stop-color="#fbf6df"/><stop offset="1" stop-color="#91bdc7"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#76b9c7"/><stop offset="1" stop-color="#183a50"/></linearGradient>
    <radialGradient id="moonlight"><stop stop-color="#b8e0ed" stop-opacity=".14"/><stop offset="1" stop-color="#b8e0ed" stop-opacity="0"/></radialGradient>
    <linearGradient id="reflection" x2="0" y2="1"><stop stop-color="#90d8db" stop-opacity=".25"/><stop offset="1" stop-color="#90d8db" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="20"/></clipPath>
