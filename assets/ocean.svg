<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
  <title id="title">Research vessel and underwater robots</title>
  <desc id="desc">A research vessel rocks gently above three underwater robots. Blue sonar arcs pulse around the lead robot as the formation cruises beneath the surface.</desc>
  <defs>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#0b2239"/>
      <stop offset="1" stop-color="#07121f"/>
    </linearGradient>
    <linearGradient id="hull" x2="0" y2="1">
      <stop stop-color="#eff7ff"/>
      <stop offset="1" stop-color="#96aec4"/>
    </linearGradient>
    <linearGradient id="metal" x2="0" y2="1">
      <stop stop-color="#d6edfa"/>
      <stop offset=".45" stop-color="#73adc5"/>
      <stop offset="1" stop-color="#274d69"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#53def8" stop-opacity=".13"/>
      <stop offset="1" stop-color="#53def8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#69b8d8" stroke-opacity=".055"/>
    </pattern>
    <clipPath id="frame"><rect width="800" height="300" rx="16"/></clipPath>
    <g id="robot">
      <path d="M-50-6-66-19-60-3-66 14-50 6" fill="#43809d" stroke="#76b4cc" stroke-width="1"/>
      <path d="M-36-10-21-23-13-23-17-9M-20 9-12 22-22 22-36 9" fill="#2e6480" stroke="#75b9d1" stroke-width="1"/>
      <path d="M-53-9H18Q42-9 51 0 42 9 18 9H-53Z" fill="url(#metal)" stroke="#a4d6e8" stroke-width="1"/>
      <path d="M18-9Q23 0 18 9" fill="none" stroke="#1c465f" stroke-width="2"/>
      <path d="M-35-9V9M-29-9V9" stroke="#e4b75c" stroke-width="3"/>
      <path d="M-23-3H11" stroke="#e0f8ff" stroke-opacity=".7"/>
      <circle cx="33" cy="0" r="3" fill="#051927" stroke="#76e8fc"/>
      <rect x="-7" y="-13" width="10" height="4" rx="1" fill="#88b5c8"/>
      <path d="M-57-8V8" stroke="#b0d8e7" stroke-width="2"/>
      <path d="M-75-4H-89M-73 3H-99" stroke="#66cde7" stroke-opacity=".28" stroke-linecap="round"/>
    </g>
  </defs>
  <style>
    .ship { transform-origin: 245px 119px; animation: rock 7s ease-in-out infinite; }
    .fleet { animation: cruise 10s ease-in-out infinite; }
    .sonar { animation: pulse 5s ease-in-out infinite; }
    @keyframes rock { 0%,100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(2px) rotate(.6deg); } }
    @keyframes cruise { 0%,100% { transform: translate(0,0); } 50% { transform: translate(12px,-3px); } }
    @keyframes pulse { 0%,100% { opacity: .18; } 50% { opacity: .85; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="800" height="300" fill="#0b1421"/>
    <path d="M0 120H800V300H0Z" fill="url(#sea)"/>
    <rect y="121" width="800" height="179" fill="url(#grid)"/>
    <!-- Distant coastline and a restrained technical frame. -->
    <path d="m510 114 37-12 21 6 33-17 47 21 38-7 46 10 35-6 33 5" fill="none" stroke="#476a81" stroke-opacity=".3"/>
    <path d="M24 42V24H42M758 24H776V42M24 258V276H42M758 276H776V258" fill="none" stroke="#39829e" stroke-opacity=".55"/>
    <circle cx="749" cy="39" r="3" fill="#59d6e6"/>
    <path d="M716 39H737" stroke="#59d6e6" stroke-opacity=".4"/>
    <!-- Research vessel: working deck, bridge, mast, radar and stern crane. -->
    <g class="ship">
      <path d="M104 99H373L355 117Q347 123 324 123H130Q115 119 104 99Z" fill="url(#hull)"/>
      <path d="M116 113H359L350 120 328 124H134Z" fill="#217491"/>
      <path d="M105 100H370" stroke="#e6faff" stroke-width="2"/>
      <path d="M226 73H317L333 99H218Z" fill="#bfd1df"/>
      <path d="M245 52H307L316 73H234Z" fill="#e3edf4"/>
      <path d="M248 57H260V67H243ZM265 57H278V67H265ZM283 57H303L307 67H283Z" fill="#153e55"/>
      <path d="M244 58H259M266 58H277M284 58H302" stroke="#6bb7d1"/>
      <path d="M238 76H302" stroke="#fff" stroke-opacity=".5"/>
      <path d="M250 82H260V91H250ZM271 82H281V91H271ZM292 82H302V91H292Z" fill="#31566b"/>
      <path d="M265 52V26M248 38H289M265 27H277" fill="none" stroke="#9db5c6" stroke-width="2"/>
      <rect x="273" y="24" width="19" height="4" rx="2" fill="#d6e8f3"/>
      <path d="M266 37 278 50M257 49V41" stroke="#6c92ac"/>
      <circle cx="265" cy="24" r="2" fill="#7ce6eb"/>
      <path d="M147 98V63H185L201 77M153 98V69H181L194 80" fill="none" stroke="#e2b967" stroke-width="3" stroke-linejoin="round"/>
      <path d="M198 78V89q0 7-6 4" fill="none" stroke="#b7cbd7" stroke-width="1.5"/>
      <rect x="163" y="87" width="30" height="11" rx="2" fill="#3e6c85"/>
      <path d="M169 89V96M175 89V96M181 89V96M187 89V96" stroke="#7496ab"/>
      <path d="M111 96V86H215M121 86V97M139 86V97M205 86V97M326 87H354V97M339 87V98" fill="none" stroke="#b4cad8" stroke-width="1.2"/>
      <path d="M306 108H333" stroke="#214b66" stroke-width="2"/>
      <circle cx="143" cy="108" r="2" fill="#264d65"/>
      <circle cx="157" cy="108" r="2" fill="#264d65"/>
      <circle cx="171" cy="108" r="2" fill="#264d65"/>
    </g>
    <!-- Surface and wake stay static to keep the painted area small. -->
    <path d="M0 121q40-4 80 0t80 0 80 0 80 0 80 0 80 0 80 0 80 0 80 0 80 0" fill="none" stroke="#63d7ea" stroke-opacity=".6"/>
    <path d="M78 128H139M112 133H178M280 129H369M336 134H386" stroke="#7bd5e5" stroke-opacity=".2" stroke-linecap="round"/>
    <path d="M270 136 322 246M291 136 357 228" stroke="#50b6d4" stroke-opacity=".1" stroke-dasharray="3 8"/>
    <g class="fleet">
      <!-- Faint formation connections, with three distinct vehicle silhouettes. -->
      <path d="M356 190 488 237 593 182Z" fill="#39bfe2" fill-opacity=".025" stroke="#52cfea" stroke-opacity=".23" stroke-dasharray="3 7"/>
      <g transform="translate(356 190) scale(.8)"><use href="#robot"/></g>
      <g transform="translate(488 237) scale(.68)"><use href="#robot"/></g>
      <g transform="translate(593 182)">
        <path d="M50 0 153-44V44Z" fill="url(#beam)"/>
        <g class="sonar" fill="none" stroke="#63dff3" stroke-width="1.5" stroke-linecap="round">
          <path d="M68-14Q80 0 68 14"/>
          <path d="M87-24Q106 0 87 24" stroke-opacity=".65"/>
          <path d="M109-35Q136 0 109 35" stroke-opacity=".35"/>
        </g>
        <use href="#robot"/>
      </g>
    </g>
    <path d="M0 289 78 281 149 290 218 280 299 294 394 286 481 293 576 283 665 292 735 279 800 288V300H0Z" fill="#060e19"/>
    <path d="M43 159H76M43 164H61M43 169H69" stroke="#64b7d1" stroke-opacity=".22"/>
  </g>
  <rect x=".5" y=".5" width="799" height="299" rx="16" fill="none" stroke="#244357" stroke-opacity=".7"/>
</svg>
